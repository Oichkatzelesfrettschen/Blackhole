name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      preset:
        description: Validation lane
        type: choice
        options: [ci, ci-analysis, ci-release, ci-clang, ci-clang-fast-math, ci-sanitize]
        default: ci
      export_dependencies:
        description: Retain portable dependency packages for local diagnosis
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.preset || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.preset || 'ci') || '["ci","ci-analysis","ci-release","ci-clang","ci-clang-fast-math","ci-sanitize"]') }}
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
      # ccache keys name the compiler that fills them; the clang lanes compile
      # with clang-18 over the same GCC 14 dependency packages.
      COMPILER_LABEL: ${{ startsWith(matrix.preset, 'ci-clang') && 'clang18' || 'gcc14' }}
      CI_PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - name: Record resources and select all available CPUs
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          jobs="$(nproc)"
          {
            echo "CMAKE_BUILD_PARALLEL_LEVEL=$jobs"
            echo "CTEST_PARALLEL_LEVEL=$jobs"
            echo "PYTHON=$PYTHON"
          } >> "$GITHUB_ENV"
          mkdir -p build/ci-reports
          { nproc; lscpu; free -h; } > build/ci-reports/resources.txt
          cat build/ci-reports/resources.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build ccache pkg-config \
            libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontenc-dev \
            libice-dev libsm-dev libxaw7-dev libxcomposite-dev libxdamage-dev \
            libxfixes-dev libxkbfile-dev libxmuu-dev libxpm-dev libxres-dev \
            libxss-dev libxt-dev libxtst-dev libxv-dev libxxf86vm-dev \
            libxcb-render-util0-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-dri3-dev libxcb-cursor-dev \
            libxcb-icccm4-dev libxcb-util-dev libxcb-xkb-dev \
            glslang-tools libcfitsio-dev libxcb-glx0-dev uuid-dev libxcb-dri2-0-dev \
            libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev
          case "$CI_PRESET" in
            ci-analysis)
              sudo apt-get install -y clang-tidy-18 cppcheck
              echo 'CLANG_TIDY=/usr/bin/clang-tidy-18' >> "$GITHUB_ENV"
              ;;
            ci-clang*)
              sudo apt-get install -y clang-18
              ;;
          esac
      - name: Install pinned build tools
        run: scripts/ci/run_stage.sh tooling "$PYTHON" -m pip install -r scripts/ci/requirements.txt
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: conan-cache
        with:
          path: .conan
          key: conan-ubuntu24-gcc14-v1-${{ hashFiles('conan.lock', 'conanfile.py', 'conan/recipes/**', 'conan/profiles/ci', 'scripts/ci/requirements.txt') }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: compiler-cache
        with:
          path: .ccache
          key: ccache-ubuntu24-${{ env.COMPILER_LABEL }}-${{ matrix.preset }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-ubuntu24-${{ env.COMPILER_LABEL }}-${{ matrix.preset }}-${{ github.sha }}-
            ccache-ubuntu24-${{ env.COMPILER_LABEL }}-${{ matrix.preset }}-
      - name: Validate CI helpers
        run: |
          "$PYTHON" scripts/ci/test_check_lockfile.py
          "$PYTHON" scripts/ci/test_check_bench_regression.py
          shellcheck -S error scripts/build.sh scripts/ci/run_stage.sh scripts/conan_init.sh scripts/conan_install.sh \
            scripts/ci/ci_replica.sh scripts/ci/cppcheck_ci.sh scripts/ci/tidy18.sh bench/ci_bench.sh
          "$PYTHON" -m ruff check scripts/ci/
          "$PYTHON" -m ruff format --check scripts/ci/
      - name: Verify ASCII-only living docs
        if: matrix.preset == 'ci'
        run: |
          "$PYTHON" scripts/ascii_sweep.py
      - name: Export locked local recipes
        run: scripts/conan_export_local_recipes.sh
      - name: Check lockfile coverage
        run: |
          scripts/ci/run_stage.sh lockfile conan lock create . --lockfile=conan.lock \
            --lockfile-out=build/ci-reports/conan.lock -pr:a conan/profiles/ci
          "$PYTHON" scripts/ci/test_check_lockfile.py
          "$PYTHON" scripts/ci/check_lockfile.py conan.lock build/ci-reports/conan.lock
      - name: Install dependencies using all CPUs
        run: |
          scripts/ci/run_stage.sh dependencies conan install . --output-folder=build/CI-deps \
            --lockfile=conan.lock --build=missing -pr:a conan/profiles/ci \
            -c:a tools.build:jobs="$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Generate a clang toolchain over the GCC 14 packages
        if: startsWith(matrix.preset, 'ci-clang')
        # compiler_executables stays out of the package id, so the GCC 14
        # packages resolve unchanged; --build=never keeps clang from building
        # any package that would enter the shared dependency cache. An empty
        # user_presets leaves CMakeUserPresets.json alone: a second include of
        # a generated conan-release preset is a duplicate CMake rejects.
        run: |
          scripts/ci/run_stage.sh clang-toolchain conan install . \
            --output-folder=build/CI-clang-deps --lockfile=conan.lock --build=never \
            -pr:a conan/profiles/ci \
            -c:h 'tools.build:compiler_executables={"c":"clang-18","cpp":"clang++-18"}' \
            -c:h 'tools.cmake.cmaketoolchain:user_presets='
      - name: Compact reusable dependency packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache clean '*' --source --build --download --temp
      - name: Save dependencies before compiling project sources
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .conan
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Export packages for local diagnosis
        if: inputs.export_dependencies
        run: conan cache save '*:*' --file=build/ci-reports/conan-packages.tgz
      - name: Configure
        run: |
          scripts/ci/run_stage.sh configure cmake --preset "$CI_PRESET" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DPYTHON3_EXECUTABLE="$PYTHON" \
            ${CLANG_TIDY:+-DCLANG_TIDY_EXE="$CLANG_TIDY"}
      - name: Build using all CPUs
        id: compile
        run: scripts/ci/run_stage.sh build cmake --build --preset "$CI_PRESET" --parallel "$CMAKE_BUILD_PARALLEL_LEVEL"
      - name: Test using all CPUs
        run: |
          exclude=
          case "$CI_PRESET" in
            ci) build_dir=build/CI ;;
            ci-analysis) build_dir=build/CI-Analysis ;;
            ci-release) build_dir=build/CI-Release ;;
            ci-clang) build_dir=build/CI-Clang ;;
            ci-clang-fast-math) build_dir=build/CI-ClangFastMath ;;
            ci-sanitize)
              # These two tests open a GL context through GLFW when a display
              # exists and, unlike the other gpu-labeled tests, carry no
              # detect_leaks=0 environment, so LeakSanitizer reports the GL
              # driver's allocations as leaks. Every other test runs.
              build_dir=build/CI-Sanitize
              exclude='^(gpu_cpu_parity|kerr_shader_capture)$'
              ;;
            *) echo "no test directory for preset $CI_PRESET" >&2; exit 2 ;;
          esac
          scripts/ci/run_stage.sh tests ctest --test-dir "$build_dir" \
            --output-on-failure --no-tests=error --parallel "$CTEST_PARALLEL_LEVEL" \
            ${exclude:+--exclude-regex "$exclude"} \
            --output-junit "$GITHUB_WORKSPACE/build/ci-reports/tests.xml"
      - name: Save compiled objects after build failures too
        if: always() && steps.compile.outcome != 'skipped' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Record compiler cache statistics
        if: always()
        run: command -v ccache && ccache --show-stats
      - name: Retain timings and failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.preset }}-${{ github.run_attempt }}
          path: |
            build/ci-reports/
            build/CI*/Testing/Temporary/
            build/CI*/CMakeFiles/CMakeConfigureLog.yaml
            build/CI*/compile_commands.json
          retention-days: 14
